name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validasi katalog obat
        run: node scripts/validate_drugs.js

      - name: Validasi monitoring
        run: node scripts/validate_monitoring.js

      - name: Validasi tabel interaksi
        run: node scripts/validate_interactions.js

      - name: Validasi data topik publik
        run: node scripts/validate_topics.js

      - name: Validasi impor fungsi (anti-gagal bundel)
        run: node scripts/validate_imports.js

      - name: Validasi proxy AI & debit (statis)
        run: node scripts/validate_ai.js

      - name: Validasi top-up (statis)
        run: node scripts/validate_topup.js

      - name: Validasi skema kredit & rumus harga
        run: node scripts/validate_credits.js

      - name: Validasi grounded pipeline & golden set
        run: node scripts/validate_grounded.js

      - name: Golden set tidak basi (build --check)
        run: node scripts/build_golden.js --check

      - name: Unit test ranking & klasifikasi pertanyaan
        run: node tests/rank_unit.js

      - name: Unit test pencarian obat dalam teks
        run: node tests/drugs_unit.js

      - name: Unit test autentikasi (auth klien)
        run: node tests/auth_unit.js

      - name: Unit test provider LLM (parse & retry)
        run: node tests/provider_unit.js

      - name: Unit test streaming jawaban (ekstraksi inkremental)
        run: node tests/stream_unit.js

      - name: Unit test grounded (abstain & red flag)
        run: node tests/grounded_unit.js

      - name: Validasi auth klien (statis)
        run: node scripts/validate_auth.js

      - name: Smoke test fungsi edge (tanpa jaringan)
        run: node tests/functions_smoke.js

      - name: Validasi cache edge & throttle NCBI
        run: node scripts/validate_cache.js

      - name: Validasi keamanan (fungsi & akses klien)
        run: node scripts/validate_security.js

      - name: Halaman topik tidak basi (build --check)
        run: node scripts/build_topics.js --check

      - name: Validasi render UI (harness)
        run: node tests/ui_harness.js
      - name: Cek sintaks JS (functions + web)
        run: |
          for f in $(find functions web -name "*.js"); do node --check "$f" || exit 1; done
          node --check scripts/housekeeping.mjs
          node --check scripts/eval_golden.mjs
