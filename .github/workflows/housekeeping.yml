name: Housekeeping mingguan

on:
  schedule:
    - cron: "20 1 * * 0"
  workflow_dispatch:

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      OPENALEX_MAIL: ${{ secrets.OPENALEX_MAIL }}
      DELTA_LOOKBACK_DAYS: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install .
      - name: Self-heal delta 30 hari
        run: |
          python -m harvester.runners.harvest_delta europepmc-delta
          python -m harvester.runners.harvest_delta clinicaltrials-delta
