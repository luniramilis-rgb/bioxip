[project]
name = "bioxip"
version = "0.1.0"
description = "bioXip - biomedical literature search for Indonesian researchers"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harvester*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
